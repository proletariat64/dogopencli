# Include INSIDE the existing port-80 server block. Preserve all other locations.
location = /plugins {
    return 308 /plugins/;
}
location /plugins/ {
    proxy_pass http://127.0.0.1:5910;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_request_buffering on;
}
