name: AI Code Review (Qoder, Kimi fallback)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qoder-review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test AI review guards and publisher
        run: node --test tests/unit/test_qoder_review.mjs tests/unit/test_kimi_review.mjs tests/unit/test_ai_review.mjs

      - name: Set review artifact paths
        run: |
          echo "REVIEW_PROMPT=$RUNNER_TEMP/ai-review-prompt.txt" >> "$GITHUB_ENV"
          echo "REVIEW_REPORT=$RUNNER_TEMP/ai-review-report.json" >> "$GITHUB_ENV"

      - name: Prepare shared review prompt and PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai_review.mjs prepare

      - name: Install Qoder quota client and CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/qoder-sdk" @qoder-ai/qoder-agent-sdk@1.0.52
          npm install -g @qoder-ai/qodercli@1.1.69

      - name: Check Qoder credits before review
        id: quota
        timeout-minutes: 2
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          QODER_SDK_PATH: ${{ runner.temp }}/qoder-sdk/node_modules/@qoder-ai/qoder-agent-sdk/dist/index.js
        run: node scripts/qoder_review.mjs check

      - name: Run Qoder Code Review
        id: review
        if: steps.quota.outputs.run_review == 'true'
        timeout-minutes: 20
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: node scripts/qoder_review.mjs review

      - name: Check Kimi quota before fallback review
        id: kimi_quota
        if: steps.quota.outputs.quota_state == 'exhausted' || steps.review.outputs.quota_state == 'exhausted'
        timeout-minutes: 2
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: node scripts/kimi_review.mjs check

      - name: Install Kimi CLI
        if: steps.kimi_quota.outputs.run_review == 'true'
        run: npm install -g @moonshot-ai/kimi-code@2.1.1

      - name: Run Kimi fallback Code Review (k3, high)
        id: kimi_review
        if: steps.kimi_quota.outputs.run_review == 'true'
        timeout-minutes: 20
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_CODE_HOME: ${{ runner.temp }}/kimi-review
          KIMI_CODE_NO_AUTO_UPDATE: '1'
          KIMI_DISABLE_TELEMETRY: '1'
          KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: '2'
        run: node scripts/kimi_review.mjs review

      - name: Publish validated PR review through GitHub API
        if: steps.review.outputs.status == 'completed' || steps.kimi_review.outputs.status == 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai_review.mjs publish
