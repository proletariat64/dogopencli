name: OCR experiment on PR 187

on:
  push:
    branches: [ci/kimi-fallback-review]
    paths: ['.github/workflows/ocr-experiment.yml']

concurrency:
  group: ai-review-187
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ocr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout experiment configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Kimi quota guard
        run: node --test tests/unit/test_kimi_quota.mjs

      - name: Check Kimi quota before review
        id: quota
        timeout-minutes: 2
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: node scripts/kimi_quota.mjs

      - name: Read experiment PR context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: 187
            });
            if (pr.head.sha !== 'f6a6e2ac4e84ad44095e231270b7366fa6077b04' || pr.base.ref !== 'master') {
              throw new Error('PR 187 moved; stop rather than review an unintended range');
            }
            return `${pr.title}\n${pr.body || ''}`;

      - name: Run OCR review with Kimi Code
        if: steps.quota.outputs.run_review == 'true'
        uses: alibaba/open-code-review@main
        with:
          pr_number: '187'
          base_ref: master
          head_sha: f6a6e2ac4e84ad44095e231270b7366fa6077b04
          # The Action takes a full endpoint rather than a provider Base URL.
          llm_url: https://api.kimi.com/coding/v1/chat/completions
          llm_auth_token: ${{ secrets.KIMI_API_KEY }}
          llm_model: k3
          llm_use_anthropic: 'false'
          llm_reasoning_effort: high
          # Override the Action's thinking-disabled default to keep K3 reasoning.
          llm_extra_body: '{}'
          rule: .opencodereview/rule.json
          background: |
            PR context: ${{ fromJSON(steps.context.outputs.result) }}
          route_categories: 'test,style,documentation,maintainability'
          route_severity_below: 'low'
          sticky_summary: 'true'
          checkpoint_range: 'true'
