<!doctype html>
<!-- Throwaway System-panel prototype. Three layouts inside the existing two-column
     workspace, selected with ?variant=A|B|C. All values are synthetic.
     Open this file directly, or serve its directory with python -m http.server. -->
<html lang="zh-CN" data-prototype="true">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dogopencli · System prototype</title>
<style>
  :root { color-scheme:light; font:14px/1.5 ui-sans-serif,system-ui,sans-serif; color:#243247; background:#f8fafc; --line:#dce3eb; --muted:#64748b; --blue:#365f9e; }
  * { box-sizing:border-box; }
  body { margin:0; }
  button,input,select { font:inherit; }
  button,summary,select,a { -webkit-tap-highlight-color:transparent; }
  button,summary { cursor:pointer; }
  button { color:#334155; background:white; border:1px solid #cbd5e1; border-radius:6px; padding:7px 12px; }
  button:hover { background:#f1f5f9; }
  button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible { outline:2px solid #527bc0; outline-offset:3px; }
  button:disabled { cursor:default; opacity:.55; }
  [hidden] { display:none!important; }
  h1,h2,h3,p { margin:0; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code,.mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; overflow-wrap:anywhere; }
  small,.muted { color:var(--muted); font-size:12px; }
  .app-bar { display:flex; align-items:center; gap:18px; height:56px; padding:0 24px; background:white; border-bottom:1px solid var(--line); }
  .brand { font-weight:650; font-size:16px; }
  .crumb { border-left:1px solid var(--line); padding-left:18px; color:var(--muted); }
  .app-bar small { margin-left:auto; }
  .prototype-label { border:1px solid #e8ce91; background:#fffbeb; color:#805e1d; border-radius:4px; padding:2px 7px; font-size:11px; }
  .shell { display:grid; grid-template-columns:270px minmax(0,1fr); max-width:1640px; margin:auto; min-height:calc(100vh - 56px); }
  aside { padding:26px 18px; border-right:1px solid var(--line); }
  .nav-heading { display:flex; justify-content:space-between; align-items:baseline; padding:0 6px; }
  .nav-heading h2 { font-size:16px; font-weight:600; }
  .nav-hint { padding:5px 6px 18px; color:var(--muted); font-size:12px; }
  .domain { margin-bottom:10px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:white; }
  .domain.selected { border-color:#6585b9; background:#f3f7fd; }
  .domain button { display:block; width:100%; border:0; padding:12px 14px; text-align:left; background:transparent; }
  .domain-heading { display:flex; justify-content:space-between; gap:8px; align-items:baseline; margin-bottom:7px; }
  .domain-name { font-weight:600; }
  .domain-foot { display:flex; justify-content:space-between; border-top:1px solid #e5eaf1; padding:6px 14px; color:var(--muted); font-size:11px; }
  .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#5d8d75; margin-right:5px; }
  .system-nav { border-top:1px solid var(--line); margin-top:24px; padding-top:20px; }
  .system-nav>small { display:block; margin:0 6px 10px; letter-spacing:.08em; font-size:10px; text-transform:uppercase; }
  #system-nav { width:100%; text-align:left; display:flex; gap:11px; align-items:center; padding:13px 14px; border-color:var(--line); }
  #system-nav[aria-current="page"] { background:#f3f7fd; border-color:#6585b9; color:#243f68; }
  #system-nav strong { display:block; font-size:14px; font-weight:600; }
  #system-nav small { display:block; margin-top:2px; font-size:11px; }
  .aside-note { margin:28px 6px 0; color:var(--muted); font-size:11px; line-height:1.8; }
  main { min-width:0; padding:27px 30px 130px; }
  .breadcrumb { font-size:12px; color:var(--muted); margin-bottom:13px; }
  .page-header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:19px; }
  h1 { font-size:24px; line-height:1.3; letter-spacing:-.4px; font-weight:620; }
  .page-header p { margin-top:7px; color:var(--muted); font-size:13px; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:4px; font-size:11px; font-weight:500; white-space:nowrap; border:1px solid #e2e8f0; background:#f8fafc; color:#64748b; }
  .good { color:#26704f; background:#f0f8f3; border-color:#d8eade; }
  .warn { color:#946200; background:#fffbef; border-color:#eee2b9; }
  .neutral { color:#64748b; background:#f8fafc; }
  .box { border:1px solid var(--line); background:white; border-radius:7px; overflow:hidden; }
  .summary-head { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .summary-head h2 { font-size:14px; font-weight:600; }
  .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:5px 0 19px; }
  .metric { padding:0 20px; border-right:1px solid #e8edf3; }
  .metric:last-child { border:0; }
  .metric-label { color:var(--muted); font-size:12px; margin-bottom:7px; }
  .metric-value { font-size:27px; font-weight:600; letter-spacing:-.8px; line-height:1.2; font-variant-numeric:tabular-nums; }
  .metric-value small { font-size:13px; font-weight:400; margin-left:3px; letter-spacing:0; }
  .metric-note { color:var(--muted); font-size:11px; margin-top:7px; }
  .sample-note { font-size:11px; padding:9px 20px; background:#fafbfd; border-top:1px solid #e9edf2; color:var(--muted); }
  .section-links { display:flex; flex-wrap:wrap; gap:22px; margin:19px 1px; font-size:12px; }
  .sections { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .section { scroll-margin-top:20px; min-width:0; }
  .section.wide { grid-column:1/-1; }
  .section-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:18px 20px 12px; }
  .section-head h2 { font-size:15px; font-weight:600; }
  .section-head p { color:var(--muted); font-size:12px; margin-top:5px; }
  .section-num { color:#8093ae; font-size:11px; letter-spacing:.05em; margin-right:7px; }
  .kv { margin:0; padding:0 20px 13px; }
  .kv>div { display:grid; grid-template-columns:105px minmax(0,1fr); gap:10px; padding:9px 0; border-bottom:1px solid #f0f3f7; align-items:baseline; }
  .kv>div:last-child { border-bottom:0; }
  dt { color:var(--muted); font-size:12px; }
  dd { margin:0; font-size:12px; overflow-wrap:anywhere; }
  .short-stats { display:flex; flex-wrap:wrap; gap:30px; padding:3px 20px 16px; }
  .short-stats b { font-size:20px; font-weight:550; margin-right:5px; font-variant-numeric:tabular-nums; }
  .short-stats span { color:var(--muted); font-size:12px; }
  .storage-path { margin:0 20px 14px; padding:8px 10px; border:1px solid #e7edf3; border-radius:4px; background:#fafbfd; color:#53637a; }
  .storage-path>span { color:var(--muted); margin-right:10px; font-size:11px; }
  .footnote { padding:0 20px 15px; color:var(--muted); font-size:11px; }
  .expand { border-top:1px solid #e9edf2; }
  .expand>summary { padding:11px 20px; font-size:12px; color:var(--blue); }
  .expand[open]>summary { border-bottom:1px solid #edf1f5; }
  .table-tools { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:13px 20px; }
  .filter { display:flex; flex-wrap:wrap; gap:5px; }
  .filter button { padding:3px 9px; font-size:11px; border-color:transparent; background:transparent; }
  .filter button[aria-pressed="true"] { color:var(--blue); background:#edf3fb; }
  .table-tools input { border:1px solid var(--line); border-radius:4px; padding:5px 9px; width:210px; font-size:12px; max-width:100%; }
  .table-scroll { overflow:auto; }
  table { width:100%; border-collapse:collapse; text-align:left; font-size:12px; }
  th { background:#fafbfd; color:var(--muted); font-size:11px; font-weight:500; white-space:nowrap; }
  th,td { padding:10px 20px; border-bottom:1px solid #edf1f5; vertical-align:middle; }
  td small { display:block; font-size:10px; margin-top:2px; }
  td:first-child { min-width:205px; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .table-note { padding:10px 20px 12px; font-size:11px; color:var(--muted); }
  .state-panel { margin:0 20px 18px; padding:19px; border:1px dashed #d9e1eb; border-radius:5px; background:#fafbfd; }
  .state-panel strong { display:block; font-size:13px; font-weight:550; }
  .state-panel p { margin-top:6px; color:var(--muted); font-size:12px; }
  .report-sections { display:block; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:white; }
  .report-sections .section { border:0; border-radius:0; }
  .report-sections .section+.section { border-top:1px solid var(--line); }
  .report-sections .kv { display:grid; grid-template-columns:1fr 1fr; column-gap:36px; }
  .report-sections .section-head { padding-top:22px; }
  .report-sections .section-head h2 { font-size:17px; }
  .tabs { display:flex; gap:0; border-bottom:1px solid var(--line); margin:22px 0 18px; overflow:auto; }
  .tabs button { flex-shrink:0; border:0; border-radius:0; background:transparent; padding:11px 20px; font-size:13px; border-bottom:2px solid transparent; }
  .tabs button[aria-selected="true"] { border-bottom-color:#527bc0; color:var(--blue); font-weight:600; }
  .tab-panel .kv { max-width:780px; }
  .query-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .query-card { padding:20px; }
  .query-card h2 { font-size:15px; margin-bottom:7px; }
  .query-card p { color:var(--muted); font-size:12px; margin-bottom:18px; }
  .query-facts { display:flex; gap:24px; padding-top:13px; border-top:1px solid #edf1f5; }
  .query-facts small { display:block; margin-top:4px; }
  .query-note { margin:16px 0; font-size:12px; color:var(--muted); }
  .prototype-bar { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:11px; padding:9px 12px; color:#f1f5f9; background:#25354c; border:1px solid #394c65; border-radius:10px; box-shadow:0 8px 30px #24324725; max-width:calc(100vw - 28px); }
  .prototype-bar button { color:#e8eef7; background:#344861; border-color:#485e79; padding:4px 10px; }
  .prototype-bar button:hover { background:#435b79; }
  #variant-label { min-width:135px; text-align:center; font-size:12px; }
  .prototype-bar label { font-size:11px; color:#c3cfde; border-left:1px solid #526278; padding-left:12px; }
  .prototype-bar select { background:#344861; color:#edf2f8; border:1px solid #52647c; border-radius:5px; font-size:11px; padding:4px; }
  #prototype-state { position:fixed; bottom:0; left:0; right:0; font-size:10px; text-align:center; background:#f8fafceF; color:#64748b; padding:1px 6px; z-index:6; }
  .action-note { color:#26704f; font-size:11px; min-height:17px; margin-top:7px; text-align:right; }
  html:not([data-prototype="true"]) .prototype-bar,html:not([data-prototype="true"]) #prototype-state { display:none; }
  @media(min-width:1550px) { main { padding:30px 42px 130px; } }
  @media(max-width:1100px) { .shell { grid-template-columns:230px minmax(0,1fr); } main { padding:24px 22px 130px; } .metric { padding:0 14px; } .metric-value { font-size:23px; } .sections { grid-template-columns:1fr; } .section.wide { grid-column:auto; } .report-sections .kv { display:block; } }
  @media(max-width:760px) { .shell { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); padding:16px; } #domains { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; } .domain { margin:0; } .domain button { padding:9px; } .domain-heading { display:block; margin-bottom:3px; } .domain-heading small,.domain-foot,.nav-hint,.aside-note { display:none; } .domain-name { font-size:12px; } .domain button>small { font-size:10px; } .nav-heading { margin-bottom:10px; } .system-nav { margin-top:14px; padding-top:12px; } .system-nav>small { display:none; } #system-nav { padding:8px 11px; } #system-nav small { display:inline; margin-left:10px; } #system-nav>span:last-child { display:flex; align-items:baseline; } main { padding:22px 16px 140px; } .app-bar { padding:0 16px; gap:12px; } .app-bar small,.app-bar .crumb { display:none; } .prototype-label { margin-left:auto; } .metrics { grid-template-columns:repeat(3,1fr); row-gap:20px; } .metric:nth-child(3) { border:0; } .page-header { gap:12px; } .page-header p { max-width:240px; } .summary-head { padding:14px; } .summary-head small { font-size:10px; } .metric { padding:0 14px; } .sample-note { padding:9px 14px; } .query-grid { grid-template-columns:1fr; } .prototype-bar { bottom:26px; flex-wrap:wrap; justify-content:center; gap:8px; width:355px; } .prototype-bar label { padding-left:8px; } #variant-label { min-width:132px; } #prototype-state { font-size:9px; } }
</style>
<style>
  @media(max-width:760px) {
    .domain button>small { display:none; }
    .domain-heading small { display:block; font-size:10px; margin-top:4px; }
    .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .metric:nth-child(3) { border-right:1px solid #e8edf3; }
    .metric:nth-child(2n),.metric:last-child { border-right:0; }
    .metric:last-child { grid-column:1/-1; border-top:1px solid #e8edf3; padding-top:15px; }
  }
</style>
<header class="app-bar"><span class="brand">dogopencli</span><span class="crumb">Query workspace</span><span class="prototype-label">交互原型 · 示例数据</span><small>Local CLI workspace</small></header>
<div class="shell">
  <aside aria-label="Workspace navigation">
    <div class="nav-heading"><h2>Domains</h2><small>4 domains</small></div>
    <p class="nav-hint">Select a domain to view its queries.</p>
    <nav id="domains" aria-label="Domains"></nav>
    <div class="system-nav"><small>Console</small><button id="system-nav" type="button" data-view="system"><span><strong>System</strong><small>info &amp; storage</small></span></button></div>
    <p class="aside-note">所有数值与路径均为原型示例。<br>切换页面不会读取配置或业务数据库。</p>
  </aside>
  <main id="content"></main>
</div>
<div class="prototype-bar" aria-label="Prototype controls">
  <button id="prev-variant" aria-label="上一个排布方案">←</button><span id="variant-label"></span><button id="next-variant" aria-label="下一个排布方案">→</button>
  <label for="scenario">数据状态</label><select id="scenario"><option value="ready">正常示例</option><option value="empty">尚无数据</option><option value="unavailable">读取受限</option></select>
</div>
<div id="prototype-state" role="status" aria-live="polite"></div>
<script>
  const params = new URLSearchParams(location.search);
  const variants = ['A','B','C'];
  const variantNames = {A:'卡片分区 · 推荐', B:'连续报告', C:'分类标签页'};
  const state = {view:params.get('view')||'system', variant:variants.includes(params.get('variant'))?params.get('variant'):'A', scenario:['ready','empty','unavailable'].includes(params.get('scenario'))?params.get('scenario'):'ready', tab:'basic', cacheFilter:'all', datasetFilter:'all', search:'', open:new Set(), reread:false};
  const domains = [{id:'payment',name:'Payment',count:4},{id:'collection',name:'Collection',count:1},{id:'liquidity',name:'Liquidity',count:2},{id:'fx',name:'FX',count:1}];
  const cacheRows = [
    {leaf:'payment.sla.baselines',name:'付款 SLA 基线',rows:120,time:'10-22 17:20',status:'fresh'},
    {leaf:'payment.channel',name:'付款渠道',rows:240,time:'10-22 16:45',status:'fresh'},
    {leaf:'collection.cost',name:'收款渠道成本',rows:68,time:'10-18 11:10',status:'stale'},
    {leaf:'liquidity.cash.accounts',name:'现金账户',rows:3730,time:'10-22 15:30',status:'fresh'},
    {leaf:'liquidity.reference.entities',name:'流动性主体',rows:22,time:'10-18 09:15',status:'stale'},
    {leaf:'fx.trade',name:'FX 交易',rows:null,time:'—',status:'missing'}
  ];
  const datasets = [
    {leaf:'payment.sla.baselines',rows:3600,time:'10-21 14:20',status:'installed'},
    {leaf:'payment.channel',rows:7200,time:'10-22 09:45',status:'installed'},
    {leaf:'collection.cost',rows:680,time:'10-19 11:10',status:'installed'},
    {leaf:'liquidity.cash.accounts',rows:11200,time:'10-22 12:30',status:'installed'},
    {leaf:'liquidity.reference.entities',rows:0,time:'—',status:'installed'},
    {leaf:'fx.trade',rows:0,time:'—',status:'installed'},
    {leaf:'liquidity.forecast.accuracy',rows:1500,time:'10-17 10:00',status:'retained'}
  ];
  const number = value => value == null ? '—' : value.toLocaleString('en-US');
  const badge = (text,kind='neutral') => `<span class="badge ${kind}">${text}</span>`;
  function surfaceState() {
    document.getElementById('prototype-state').textContent = `原型状态：${state.view} · 方案 ${state.variant} · ${document.querySelector('#scenario option:checked').textContent} · 展开 ${document.querySelectorAll('details[open]').length} 处 · 仅示例，无数据读写`;
  }
  function updateURL() {
    const url = new URL(location.href);
    for(const key of ['view','variant','scenario']) url.searchParams.set(key,state[key]);
    try { history.replaceState(null,'',url); } catch {}
  }
  function kv(rows) { return `<dl class="kv">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`; }
  function head(num,title,description,status='只读') { return `<div class="section-head"><div><h2><span class="section-num">${num}</span>${title}</h2><p>${description}</p></div>${badge(status)}</div>`; }
  function basicSection() {
    return `<section id="basic" class="section box">${head('01','基础配置','当前工作区使用的配置与读取方式。')}${kv([
      ['配置文件','<code>~/.config/dogopencli/config.toml</code>'],['默认输出','JSON'],['缓存保留时间','72 小时'],['浏览器连接','<code>http://127.0.0.1:9222</code>'],['浏览器配置目录','<code>~/.local/share/dogopencli/browser-profile</code>']
    ])}<p class="footnote">路径与配置值为示例；此面板不提供修改操作。</p></section>`;
  }
  function installSection() {
    return `<section id="installation" class="section box">${head('02','安装信息','CLI 运行环境与当前安装位置。')}${kv([
      ['CLI 版本','<strong>0.5.1</strong>'],['Python','3.14.7'],['运行环境','Linux · x86_64'],['安装方式','uv tool · wheel'],['安装目录','<code>~/.local/share/uv/tools/dogopencli/</code>'],['已安装 leaf','8 个 · 4 个 domain']
    ])}<p class="footnote">未提供安装时间；不将文件修改时间视为安装时间。</p></section>`;
  }
  function storageState(kind) {
    const cache=kind==='cache';
    if(state.scenario==='empty') return `<div class="state-panel"><strong>${cache?'尚未保存查询快照':'尚未创建数据集'}</strong><p>${cache?'当前没有已保存的 List 快照。该状态不表示线上没有业务数据。':'当前工作区尚无可展示的数据集；查看此页不会创建数据库或空表。'}</p></div>`;
    if(state.scenario==='unavailable') return `<div class="state-panel"><strong>${cache?'缓存信息暂不可读取':'数据库正在被其他进程使用'}</strong><p>${cache?'本次统计不可用，数量显示为「—」，不以 0 代替未知值。':'保留已有库与绑定；不抢占连接，也不进行初始化或修复。'}</p></div>`;
    return '';
  }
  function cacheDetail() {
    return `<details class="expand" data-detail="cache" ${state.open.has('cache')?'open':''}><summary>按 leaf 查看快照明细 <span class="muted">· 6 个 List leaf</span></summary><div class="table-tools"><div class="filter" aria-label="缓存筛选">${[['all','全部 6'],['fresh','未过期 3'],['stale','已过期 2'],['missing','未保存 1']].map(([k,v])=>`<button data-cache-filter="${k}" aria-pressed="${state.cacheFilter===k}">${v}</button>`).join('')}</div><span class="muted">仅最近一次保存的快照</span></div><div class="table-scroll"><table><thead><tr><th>Leaf</th><th>状态</th><th>保存行数</th><th>采集时间（示例）</th></tr></thead><tbody id="cache-rows">${renderCacheRows()}</tbody></table></div><p class="table-note">未过期只指缓存 TTL，不代表业务数据新鲜度；保存行数不代表业务总量。Get-only leaf 无 List 缓存，不计入上表。</p></details>`;
  }
  function renderCacheRows() {
    return cacheRows.filter(r=>state.cacheFilter==='all'||r.status===state.cacheFilter).map(r=>`<tr><td><code>${r.leaf}</code><small>${r.name}</small></td><td>${r.status==='fresh'?badge('未过期','good'):r.status==='stale'?badge('已过期','warn'):badge('未保存')}</td><td class="num">${number(r.rows)}</td><td class="num">${r.time}</td></tr>`).join('');
  }
  function cacheSection() {
    const ready=state.scenario==='ready';
    return `<section id="cache" class="section box wide">${head('03','Cache','各 List leaf 最近保存的临时查询快照。',ready?'5 个快照':state.scenario==='empty'?'尚无数据':'读取受限')}<div class="short-stats"><div><b>${ready?'5':state.scenario==='empty'?'0':'—'}</b><span>已保存快照</span></div><div><b>${ready?'4,180':state.scenario==='empty'?'0':'—'}</b><span>快照行数合计</span></div><div><b>${ready?'3.4':state.scenario==='empty'?'—':'—'}</b><span>MiB 文件大小</span></div></div><div class="storage-path"><span>缓存文件</span><code>~/.config/dogopencli/leaf-cache.sqlite3</code></div>${storageState('cache')}${ready?cacheDetail():''}</section>`;
  }
  function renderDatasetRows() {
    return datasets.filter(r=>(state.datasetFilter==='all'||r.status===state.datasetFilter)&&r.leaf.includes(state.search.trim().toLowerCase())).map(r=>`<tr><td><code>${r.leaf}</code></td><td>${r.status==='retained'?badge('卸载后保留','warn'):badge('已安装')}</td><td class="num">${number(r.rows)}</td><td class="num">${r.time}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">没有匹配的数据集。</td></tr>';
  }
  function duckdogDetail() {
    return `<details class="expand" data-detail="datasets" ${state.open.has('datasets')?'open':''}><summary>展开数据集明细 <span class="muted">· 7 个 leaf 数据集</span></summary><div class="table-tools"><div class="filter" aria-label="数据集筛选">${[['all','全部 7'],['installed','已安装 6'],['retained','保留数据 1']].map(([k,v])=>`<button data-dataset-filter="${k}" aria-pressed="${state.datasetFilter===k}">${v}</button>`).join('')}</div><input id="dataset-search" type="search" aria-label="搜索数据集" placeholder="搜索 leaf 名称" value=""></div><div class="table-scroll"><table><thead><tr><th>归属 leaf</th><th>关联状态</th><th>已保留行数</th><th>最近导入（示例）</th></tr></thead><tbody id="dataset-rows">${renderDatasetRows()}</tbody></table></div><p class="table-note">只展示工作区已绑定的数据集；不展示库内其他表或业务记录。列表刷新不会自动导入 Duckdog。</p></details>`;
  }
  function duckdogSection() {
    const ready=state.scenario==='ready';
    return `<section id="duckdog" class="section box wide">${head('04','Duckdog','独立保留的数据集，与临时 Cache 分开统计。',ready?'已存在':state.scenario==='empty'?'尚无数据':'数据库忙')}<div class="short-stats"><div><b>${ready?'1':state.scenario==='empty'?'0':'—'}</b><span>当前工作区库</span></div><div><b>${ready?'7':state.scenario==='empty'?'0':'—'}</b><span>绑定数据集</span></div><div><b>${ready?'24,180':state.scenario==='empty'?'0':'—'}</b><span>保留行数合计</span></div><div><b>${ready?'48.2':'—'}</b><span>MiB 文件大小</span></div></div><div class="storage-path"><span>数据库</span><code>~/.config/dogopencli/duckdog.duckdb</code></div>${storageState('duckdog')}${ready?duckdogDetail():''}<p class="footnote">示例口径：当前工作区绑定的库与 leaf 数据集，包含卸载后保留的数据。实际统计接口及行数读取成本待实现阶段确认。</p></section>`;
  }
  const sectionFns={basic:basicSection,installation:installSection,cache:cacheSection,duckdog:duckdogSection};
  function summaryBox() {
    const ready=state.scenario==='ready',empty=state.scenario==='empty';
    const metric=(label,value,note)=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;
    return `<section class="box" aria-label="System 基础统计"><div class="summary-head"><h2>System 概览</h2><small>当前工作区 · 示例时间 2026-10-22 18:30</small></div><div class="metrics">${metric('CLI 版本','0.5.1','Python 3.14.7')}${metric('已安装 leaf','8','4 个 domain')}${metric('Cache 快照',ready?'5':empty?'0':'—',ready?'3 未过期 · 2 已过期':empty?'尚无保存快照':'元信息暂不可读')}${metric('Duckdog 数据集',ready?'7':empty?'0':'—',ready?'含 1 个卸载后保留':empty?'尚无绑定数据集':'数据库忙')}${metric('Duckdog 文件',ready?'48.2<small>MiB</small>':'—',ready?'库文件占用':'未获取大小')}</div><div class="sample-note">只读系统信息。原型内所有数值、路径、状态均为示例；不代表本机实际统计。</div></section>`;
  }
  function VariantA() { return `<nav class="section-links" aria-label="System 信息分区">${Object.keys(sectionFns).map((k,i)=>`<a href="#${k}">${['基础配置','安装信息','Cache','Duckdog'][i]} ↓</a>`).join('')}</nav><div class="sections">${Object.values(sectionFns).map(fn=>fn()).join('')}</div>`; }
  function VariantB() { return `<nav class="section-links" aria-label="System 信息目录">${Object.keys(sectionFns).map((k,i)=>`<a href="#${k}">0${i+1} ${['基础配置','安装信息','Cache','Duckdog'][i]}</a>`).join('')}</nav><div class="report-sections">${Object.values(sectionFns).map(fn=>fn()).join('')}</div>`; }
  function VariantC() { return `<div class="tabs" role="tablist" aria-label="System 分类">${Object.keys(sectionFns).map((k,i)=>`<button role="tab" id="tab-${k}" aria-controls="system-tab-panel" aria-selected="${state.tab===k}" data-tab="${k}">${['基础配置','安装信息','Cache','Duckdog'][i]}</button>`).join('')}</div><div id="system-tab-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${sectionFns[state.tab]()}</div>`; }
  function systemView() {
    return `<p class="breadcrumb">Console / System</p><header class="page-header"><div><h1>System</h1><p>查看本机配置、安装环境和已保存的数据概况。</p></div><div><button id="reread">↻ 重新读取</button><div class="action-note" role="status">${state.reread?'已重新载入示例数据':'只读 · 不修改配置'}</div></div></header>${summaryBox()}${{A:VariantA,B:VariantB,C:VariantC}[state.variant]()}`;
  }
  function domainView() {
    const domain=domains.find(d=>d.id===state.view)||domains[0];
    const leaves=[...cacheRows.filter(r=>r.leaf.startsWith(domain.id+'.'))];
    if(domain.id==='payment') leaves.push({leaf:'payment.ptr.orders',name:'PTR 订单详情',rows:null,time:'—'},{leaf:'payment.ptr.cases',name:'PTR 案例详情',rows:null,time:'—'});
    return `<p class="breadcrumb">Domains / ${domain.name} / Queries</p><header class="page-header"><div><h1>${domain.name}</h1><p>${domain.count} queries · 现有查询工作区的示例占位</p></div>${badge('示例数据')}</header><p class="query-note">点击左侧 <strong>System</strong>，查看新信息面板。这里仅保留 domain 导航的上下文，不连接真实查询或文档编辑。</p><div class="query-grid">${leaves.map(r=>`<article class="query-card box"><h2>${r.name}</h2><p><code>${r.leaf}</code></p><div class="query-facts"><span>${number(r.rows)}<small>Saved rows</small></span><span>${r.time}<small>Captured · 示例</small></span></div></article>`).join('')}</div>`;
  }
  function render() {
    document.getElementById('domains').innerHTML=domains.map(d=>`<div class="domain ${state.view===d.id?'selected':''}"><button data-view="${d.id}" ${state.view===d.id?'aria-current="page"':''}><span class="domain-heading"><span class="domain-name">${d.name}</span><small>${d.count} queries</small></span><small><span class="status-dot"></span>Last check recorded · 示例</small></button><div class="domain-foot"><span>Enabled</span><span>Read-only preview</span></div></div>`).join('');
    document.getElementById('system-nav').setAttribute('aria-current',state.view==='system'?'page':'false');
    document.getElementById('content').innerHTML=state.view==='system'?systemView():domainView();
    document.getElementById('variant-label').textContent=`${state.variant} · ${variantNames[state.variant]}`;
    document.getElementById('scenario').value=state.scenario;
    const search=document.getElementById('dataset-search');if(search) search.value=state.search;
    document.querySelectorAll('details[data-detail]').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)state.open.add(el.dataset.detail);else state.open.delete(el.dataset.detail);surfaceState();}));
    updateURL();surfaceState();
  }
  function cycleVariant(delta) { state.variant=variants[(variants.indexOf(state.variant)+delta+variants.length)%variants.length];state.view='system';render(); }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.view){state.view=button.dataset.view;state.reread=false;render();window.scrollTo(0,0);}
    if(button.dataset.tab){state.tab=button.dataset.tab;render();}
    if(button.dataset.cacheFilter){state.cacheFilter=button.dataset.cacheFilter;render();}
    if(button.dataset.datasetFilter){state.datasetFilter=button.dataset.datasetFilter;render();}
    if(button.id==='prev-variant')cycleVariant(-1);
    if(button.id==='next-variant')cycleVariant(1);
    if(button.id==='reread'){state.reread=true;render();}
  });
  document.getElementById('scenario').addEventListener('change',event=>{state.scenario=event.target.value;state.reread=false;render();});
  document.addEventListener('input',event=>{if(event.target.id==='dataset-search'){state.search=event.target.value;document.getElementById('dataset-rows').innerHTML=renderDatasetRows();surfaceState();}});
  document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycleVariant(event.key==='ArrowLeft'?-1:1);}});
  render();
</script>
</html>
