[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogopencli"
version = "0.1.7"
description = "Inquiry-only CLI for payment and collection product operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dogopencli = "dogopencli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing probe/docs tests predate the Ruff gate; keep them untouched.
"tests/integration/channel_pages_probe.py" = ["E501"]
"tests/test_doc_guard.py" = ["E501"]
"tests/test_prepare_channel_snapshot.py" = ["E741"]
