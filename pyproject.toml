[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogopencli"
version = "0.6.0"
description = "Inquiry-only CLI for payment, collection, liquidity and FX operations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "websocket-client>=1.7",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[project.scripts]
dogopencli = "dogopencli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-n 8"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = [".qoder"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Documentation guard fixtures contain long literal examples.
"tests/test_doc_guard.py" = ["E501"]

[tool.setuptools.package-data]
"dogopencli" = ["leaf_packages/**/*", "gui_page.html"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
